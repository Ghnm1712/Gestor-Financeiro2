<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão Finança | Gestão Financeira Moderno</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Ajuste para o scrollbar do histórico */
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen">

    <nav class="bg-white border-b border-slate-100 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-2">
                    <div class="bg-indigo-600 text-white p-2 rounded-xl shadow-md shadow-indigo-200">
                        <i data-lucide="wallet" class="w-5 h-5"></i>
                    </div>
                    <span class="text-xl font-bold tracking-tight text-slate-900">Gestão<span class="text-indigo-600">Finança</span></span>
                </div>
                
                <div class="flex items-center gap-4">
                    <a href="https://mpago.la/2s6itmr" target="_blank" rel="noopener noreferrer" class="hidden sm:flex items-center gap-2 bg-gradient-to-r from-sky-500 to-blue-600 text-white font-semibold text-xs px-4 py-2 rounded-xl shadow-sm hover:from-sky-600 hover:to-blue-700 transition-all transform hover:scale-[1.02] active:scale-[0.98]">
                        <i data-lucide="heart" class="w-4 h-4 fill-white"></i> Apoiar Projeto
                    </a>
                    
                    <div class="bg-slate-100 px-3 py-1.5 rounded-full flex items-center gap-1.5 border border-transparent focus-within:border-indigo-500 transition-all">
                        <i data-lucide="calendar" class="w-4 h-4 text-indigo-600"></i>
                        <select id="select-mes" class="bg-transparent text-xs sm:text-sm text-slate-600 font-medium focus:outline-none cursor-pointer pr-1">
                            <option value="janeiro">Janeiro</option>
                            <option value="fevereiro">Fevereiro</option>
                            <option value="marco">Março</option>
                            <option value="abril">Abril</option>
                            <option value="maio">Maio</option>
                            <option value="junho">Junho</option>
                            <option value="julho">Julho</option>
                            <option value="agosto">Agosto</option>
                            <option value="setembro">Setembro</option>
                            <option value="outubro">Outubro</option>
                            <option value="novembro">Novembro</option>
                            <option value="dezembro">Dezembro</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm transition-all hover:shadow-md">
                <div class="flex justify-between items-start mb-4">
                    <span class="text-sm font-medium text-slate-500 uppercase tracking-wider">Entradas</span>
                    <span class="bg-emerald-50 text-emerald-600 p-2.5 rounded-xl"><i data-lucide="arrow-up-right" class="w-5 h-5"></i></span>
                </div>
                <h3 id="total-entradas" class="text-2xl sm:text-3xl font-bold text-slate-900">R$ 0,00</h3>
            </div>

            <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm transition-all hover:shadow-md">
                <div class="flex justify-between items-start mb-4">
                    <span class="text-sm font-medium text-slate-500 uppercase tracking-wider">Saídas</span>
                    <span class="bg-rose-50 text-rose-600 p-2.5 rounded-xl"><i data-lucide="arrow-down-left" class="w-5 h-5"></i></span>
                </div>
                <h3 id="total-saidas" class="text-2xl sm:text-3xl font-bold text-slate-900">R$ 0,00</h3>
            </div>

            <div id="card-saldo" class="bg-slate-900 text-white p-6 rounded-2xl shadow-xl transition-colors duration-300">
                <div class="flex justify-between items-start mb-4">
                    <span class="text-sm font-medium text-slate-400 uppercase tracking-wider">Saldo Atual</span>
                    <span id="saldo-icon" class="bg-slate-800 text-indigo-400 p-2.5 rounded-xl"><i data-lucide="scale" class="w-5 h-5"></i></span>
                </div>
                <h3 id="saldo-total" class="text-2xl sm:text-3xl font-bold">R$ 0,00</h3>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm h-fit">
                <h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
                    <i data-lucide="plus-circle" class="w-5 h-5 text-indigo-600"></i> Nova Transação
                </h2>
                
                <form id="transaction-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Descrição</label>
                        <input type="text" id="desc" required placeholder="Ex: Salário, Aluguel, Mercado" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-colors bg-slate-50/50">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Valor (R$)</label>
                        <input type="number" step="0.01" min="0.01" id="amount" required placeholder="0,00" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-colors bg-slate-50/50">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Tipo de Transação</label>
                        <div class="grid grid-cols-2 gap-3">
                            <label class="flex items-center justify-center gap-2 border-2 border-slate-100 rounded-xl p-3 cursor-pointer hover:bg-slate-50 transition-all has-[:checked]:border-emerald-500 has-[:checked]:bg-emerald-50/50 has-[:checked]:text-emerald-700 font-medium text-slate-600 text-sm">
                                <input type="radio" name="type" value="entrada" checked class="hidden">
                                <i data-lucide="trending-up" class="w-4 h-4 text-emerald-500"></i> Entrada
                            </label>
                            <label class="flex items-center justify-center gap-2 border-2 border-slate-100 rounded-xl p-3 cursor-pointer hover:bg-slate-50 transition-all has-[:checked]:border-rose-500 has-[:checked]:bg-rose-50/50 has-[:checked]:text-rose-700 font-medium text-slate-600 text-sm">
                                <input type="radio" name="type" value="saida" class="hidden">
                                <i data-lucide="trending-down" class="w-4 h-4 text-rose-500"></i> Saída
                            </label>
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-indigo-600 text-white font-semibold py-3 px-4 rounded-xl hover:bg-indigo-700 active:scale-[0.98] transition-all shadow-lg shadow-indigo-600/10 mt-2">
                        Adicionar Transação
                    </button>
                </form>
            </div>

            <div class="lg:col-span-2 bg-white p-6 rounded-2xl border border-slate-100 shadow-sm flex flex-col">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                    <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2">
                        <i data-lucide="history" class="w-5 h-5 text-indigo-600"></i> Histórico de Atividades
                    </h2>
                    
                    <div class="flex bg-slate-100 p-1 rounded-xl text-xs font-semibold self-stretch sm:self-auto">
                        <button onclick="filterTransactions('todos')" id="filter-todos" class="px-3 py-1.5 rounded-lg transition-all bg-white text-slate-800 shadow-sm">Todos</button>
                        <button onclick="filterTransactions('entrada')" id="filter-entrada" class="px-3 py-1.5 rounded-lg transition-all text-slate-500 hover:text-slate-800">Entradas</button>
                        <button onclick="filterTransactions('saida')" id="filter-saida" class="px-3 py-1.5 rounded-lg transition-all text-slate-500 hover:text-slate-800">Saídas</button>
                    </div>
                </div>

                <div class="overflow-x-auto flex-1">
                    <ul id="transaction-list" class="divide-y divide-slate-100 max-h-[420px] overflow-y-auto pr-2 space-y-2 custom-scroll">
                        </ul>
                    <div id="empty-state" class="text-center py-16 text-slate-400 hidden">
                        <i data-lucide="receipt" class="w-12 h-12 mx-auto mb-3 text-slate-200"></i>
                        <p class="text-sm font-medium">Nenhuma transação registrada.</p>
                    </div>
                </div>

                <div class="border-t border-slate-100 pt-4 mt-4 flex justify-end">
                    <button id="clear-btn" class="text-xs font-semibold text-rose-500 hover:text-rose-700 hover:bg-rose-50 px-3 py-2 rounded-xl transition-colors flex items-center gap-1.5">
                        <i data-lucide="trash-2" class="w-4 h-4"></i> Limpar Histórico
                    </button>
                </div>
            </div>

        </div>
    </main>

    <script>
        const form = document.getElementById('transaction-form');
        const descInput = document.getElementById('desc');
        const amountInput = document.getElementById('amount');
        const list = document.getElementById('transaction-list');
        const emptyState = document.getElementById('empty-state');
        const clearBtn = document.getElementById('clear-btn');

        const totalEntradasEl = document.getElementById('total-entradas');
        const totalSaidasEl = document.getElementById('total-saidas');
        const saldoTotalEl = document.getElementById('saldo-total');
        const cardSaldo = document.getElementById('card-saldo');

        let transactions = JSON.parse(localStorage.getItem('transactions')) || [];
        let currentFilter = 'todos';

        function updateValues() {
            const amounts = transactions.map(t => t.type === 'saida' ? -t.amount : t.amount);
            const total = amounts.reduce((acc, item) => acc + item, 0);
            
            const entradas = transactions.filter(t => t.type === 'entrada').reduce((acc, t) => acc + t.amount, 0);
            const saidas = transactions.filter(t => t.type === 'saida').reduce((acc, t) => acc + t.amount, 0);

            totalEntradasEl.innerText = formatCurrency(entradas);
            totalSaidasEl.innerText = formatCurrency(saidas);
            saldoTotalEl.innerText = formatCurrency(total);

            if (total < 0) {
                cardSaldo.className = "bg-rose-950 text-white p-6 rounded-2xl shadow-xl transition-colors duration-300";
                saldoTotalEl.classList.add('text-rose-400');
            } else {
                cardSaldo.className = "bg-slate-900 text-white p-6 rounded-2xl shadow-xl transition-colors duration-300";
                saldoTotalEl.classList.remove('text-rose-400');
            }
        }

        function formatCurrency(value) {
            return `R$ ${value.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`;
        }

        function renderTransactions() {
            list.innerHTML = '';
            const filtered = transactions.filter(t => currentFilter === 'todos' || t.type === currentFilter);

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                lucide.createIcons();
                return;
            }
            emptyState.classList.add('hidden');

            filtered.forEach(t => {
                const li = document.createElement('li');
                const isEntrada = t.type === 'entrada';
                
                li.className = "flex items-center justify-between p-4 bg-slate-50/60 hover:bg-slate-50 rounded-xl transition-all border border-slate-100/50 group";
                li.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="${isEntrada ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'} w-10 h-10 rounded-xl flex items-center justify-center">
                            <i data-lucide="${isEntrada ? 'arrow-up-right' : 'arrow-down-left'}" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <p class="font-bold text-slate-800 text-sm sm:text-base break-all max-w-[150px] sm:max-w-xs">${t.desc}</p>
                            <p class="text-xs text-slate-400">${t.date}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-3 ml-2">
                        <span class="font-bold text-sm sm:text-base whitespace-nowrap ${isEntrada ? 'text-emerald-600' : 'text-rose-600'}">
                            ${isEntrada ? '+' : '-'} R$ ${t.amount.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}
                        </span>
                        <button onclick="removeTransaction(${t.id})" class="text-slate-300 hover:text-rose-600 p-2 rounded-lg hover:bg-rose-50 md:opacity-0 md:group-hover:opacity-100 transition-all">
                            <i data-lucide="trash" class="w-4 h-4"></i>
                        </button>
                    </div>
                `;
                list.appendChild(li);
            });
            
            lucide.createIcons();
        }

        window.filterTransactions = function(type) {
            currentFilter = type;
            ['todos', 'entrada', 'saida'].forEach(f => {
                const btn = document.getElementById(`filter-${f}`);
                btn.className = f === type 
                    ? "px-3 py-1.5 rounded-lg transition-all bg-white text-slate-800 shadow-sm"
                    : "px-3 py-1.5 rounded-lg transition-all text-slate-500 hover:text-slate-800";
            });
            renderTransactions();
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const selectedType = document.querySelector('input[name="type"]:checked').value;
            const now = new Date();
            const formattedDate = `${now.getDate().toString().padStart(2, '0')}/${(now.getMonth() + 1).toString().padStart(2, '0')} às ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;

            const transaction = {
                id: Date.now(),
                desc: descInput.value.trim(),
                amount: parseFloat(amountInput.value),
                type: selectedType,
                date: formattedDate
            };

            transactions.unshift(transaction);
            saveAndRefresh();

            descInput.value = '';
            amountInput.value = '';
            descInput.focus();
        });

        window.removeTransaction = function(id) {
            transactions = transactions.filter(t => t.id !== id);
            saveAndRefresh();
        }

        clearBtn.addEventListener('click', () => {
            if (transactions.length === 0) return;
            if (confirm('Deseja apagar permanentemente todo o histórico?')) {
                transactions = [];
                saveAndRefresh();
            }
        });

        function saveAndRefresh() {
            localStorage.setItem('transactions', JSON.stringify(transactions));
            renderTransactions();
            updateValues();
        }

        saveAndRefresh();
        lucide.createIcons();
    </script>
</body>
</html>
